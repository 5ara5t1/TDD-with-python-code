[project]
name = "superlists"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "5ara5t1", email = "sarasti-5@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
    "django<6",
    "pytest>=9.2.0",
    "pytest-rerunfailures>=16.7",
    "ruff>=0.17.5",
    "selenium>=4.52.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "superlists.settings"
pythonpath = ["src"]
testpaths = ["src", "tests"]
python_files = ["tests.py", "test_*.py"]

[dependency-groups]
dev = [
    "pytest-django>=4.14.0",
]
