name: ci
on: [push, pull_request]

jobs:
   linting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ matrix.python-version}}
          enable-cache: true

      - name: install code formatting tool ruff
        run: uv get ruff
      - name: lint code with ruff
        run: ruff check --output-format=github --target-version=py314
      - name: check code formatting with ruff
        run: ruff format --diff --target-version=py314
        continue-on-error: true
    
  unit-tests:
    needs: linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ matrix.python-version}}
          enable-cache: true

      - run: uv sync 
      - run: uv run pytest tests/unit/* -v 
  
  functional-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync
      - run: firefox --version && geckodriver --version  ## sanity check
      - run: uv run pytest tests/functional/* -v --reruns 1
      - uses: actions/upload-artifact@v4 # pin by SHA like others
        if: failure()
        with: 
          name: selenium-artifacts
          path: artifacts/
